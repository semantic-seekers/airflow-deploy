---

- name: Deploy Airflow
  hosts: airflow
  become: yes
  gather_facts: yes
  
  tasks:
    #- name: Remove conflicting Docker repository files
    #  file:
    #    path: "{{ item }}"
    #    state: absent
    #  loop:
    #    - /etc/apt/sources.list.d/docker.list
